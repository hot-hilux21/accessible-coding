name: Build Exe (beta build)

# Builds the Windows exe + Setup installer on every push to main and
# publishes them to the "beta" release, which is the channel a reader is on
# by default. Beta carries every push as well as every tagged release: the
# tag moves it in build-release.yml and this workflow moves it again on each
# push, so the build in beta is always the current one rather than a build
# several tags old. Nothing here touches "latest", which is the one name
# that means two different things to GitHub and to the app.
# Download:
#   exe:      https://github.com/hot-hilux21/accessible-coding/releases/download/beta/AccessibleIDE.exe
#   installer: https://github.com/hot-hilux21/accessible-coding/releases/download/beta/AccessibleIDE-Setup.exe
# The manifest beside them, version.json, describes the installer: that is
# what the app downloads when it offers an update to someone who installed it.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push is worth building. Without this, three pushes in a
# row left three Windows builds running at once, each one competing for the
# same runners, and the exe took an hour to appear. The newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      # The action majors are pinned rather than floated. A build that silently
      # changes runtime under you is a build you cannot repeat, and the whole
      # point of checking a version in is that the answer stays the same next
      # month. v5+ of these run on Node 24, which is why the runner image has
      # to be recent; windows-latest and ubuntu-latest both are.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pyyaml is here for the tests, not the app: one of them reads these
        # workflow files to check every build job stamps its own version.
        run: pip install flask pywebview pyyaml
      - name: Run smoke tests
        run: python smoke_test.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check front end wiring
        run: node tests/dom_harness.js

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the version below is worked out with
          # git describe. A shallow clone has no tags in it, so that command
          # finds nothing and every build was stamped 0.0.0.dev.N.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # A main-branch build is the newest tag plus the run number, so
          # every push carries a number that is strictly newer than the one
          # before it and says which tag it was built from.
          #
          # The run number goes at the end of the suffix because that is the
          # part the updater's version comparison reads, so the build from
          # this push sorts above the tag it was built from and below the
          # next tag. The number also says which commit someone is testing.
          $lastTag = (git describe --tags --abbrev=0 2>$null)
          if (-not $lastTag) { $lastTag = "v0.0.0" }
          $base = $lastTag -replace '^v', ''
          $version = "$base.dev.${{ github.run_number }}"
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "Stamping version $version"
      - name: Build onefile exe
        run: pyinstaller AccessibleIDE.spec --noconfirm
      # No manifest is written here. The manifest is what the updater reads to
      # decide what to download, and what it downloads is the Setup
      # installer, not this portable exe. So the manifest is written by the
      # job that builds the installer, and this artifact carries the portable
      # build on its own.
      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-windows
          path: dist/AccessibleIDE.exe

  build-installer:
    name: Build Setup installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the same reason as the exe build: the
          # installer is stamped from the newest tag.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # The same version the portable build is stamped with. Without this
          # the installer would ship a program that reports the version it
          # had when the tag was cut, and a reader who installed it would
          # then be offered the very build they are already running.
          $lastTag = (git describe --tags --abbrev=0 2>$null)
          if (-not $lastTag) { $lastTag = "v0.0.0" }
          $base = $lastTag -replace '^v', ''
          $version = "$base.dev.${{ github.run_number }}"
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "Stamping version $version"
      - name: Build onedir app
        run: pyinstaller AccessibleIDE-onedir.spec --noconfirm
      - name: Download installer prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\prereqs" -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.16/python-3.13.16-amd64.exe" -OutFile "installer\prereqs\python-3.13.16-amd64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\prereqs\vc_redist.x64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\prereqs\MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The 64-bit build of the compiler. The older releases shipped one
          # installer for both architectures and that stopped at 6.x, so the
          # arch is part of the file name now.
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Compile installer
        shell: pwsh
        run: |
          # Inno Setup 7 installs under a versioned folder, so the search is a
          # pattern rather than a fixed path. Sorted descending so a machine
          # with two versions side by side picks the newer one.
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer.iss
      - name: Describe the installer for the updater
        shell: pwsh
        run: |
          # What the app downloads when an update is offered is this
          # installer, not the portable exe beside it in the release. An
          # installed copy is a folder rather than a file, so replacing it is
          # a job for the installer, which can replace a folder that is in
          # use and under Program Files, and can close the app holding it.
          # The manifest names the file, its size and its checksum, and the
          # app refuses anything that does not match, so this step decides
          # what an update is.
          python tools/stamp_version.py manifest `
            --version "${{ steps.stamp.outputs.version }}" `
            --file installer/AccessibleIDE-Setup.exe `
            --out installer/version.json `
            --url "https://github.com/${{ github.repository }}/releases/download/beta/AccessibleIDE-Setup.exe" `
            --notes "Automatic build of the main branch."
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-Setup
          path: |
            installer/AccessibleIDE-Setup.exe
            installer/version.json

  publish-beta:
    name: Publish to beta release
    needs: [build-windows, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download exe
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-windows
          path: release/
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-Setup
          path: release/
      # Published to "beta", the channel a reader is on by default, so the
      # newest main-branch build is the one sitting in the release people
      # download from. It used to go to a separate "dev" release that the
      # app only offered through a hidden developer mode, which left the
      # current work buried under a release nobody was pointed at.
      #
      # The check runs first for the same reason the tagged release runs it:
      # beta is a channel readers are on, and a manifest naming an address
      # the app refuses, or a number that goes backwards, would leave them
      # with an update they can never install. A main-branch build is stamped
      # <newest tag>.dev.<run number>, and the run number is what puts it
      # above the tag it was built from, so the channel moves forward on
      # every push and steps up again when the next tag is cut.
      - name: Check the beta channel can move
        run: |
          version="$(python -c 'import json; print(json.load(open("release/version.json"))["version"])')"
          python tools/check_publish.py check \
            --channel beta \
            --version "$version" \
            --url "https://github.com/${{ github.repository }}/releases/download/beta/AccessibleIDE-Setup.exe" \
            --repo "${{ github.repository }}"
      - name: Update beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created only when it is missing: a tagged release normally has it
          # already, and re-creating it would take the channel off the air
          # for as long as the uploads take. The assets are replaced one by
          # one with --clobber, so a failed upload leaves the previous build
          # in place rather than nothing at all.
          gh release create beta \
            --title "Beta channel" \
            --notes "The newest build. Every push to main and every tagged release lands here, so this is always the current work." \
            --prerelease \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload beta release/AccessibleIDE.exe release/AccessibleIDE-Setup.exe \
            release/version.json \
            --clobber --repo "${{ github.repository }}"
