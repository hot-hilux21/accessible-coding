name: Build Exe (dev build)

# Builds the Windows exe + Setup installer on every push to main and
# publishes them to a "dev" release for testing a build before it is
# tagged. Readers are not pointed here: they are served by the beta and
# stable channels, which build-release.yml moves when a release is tagged.
# Download:
#   exe:      https://github.com/hothilux-21/accessible-coding/releases/download/dev/AccessibleIDE.exe
#   installer: https://github.com/hothilux-21/accessible-coding/releases/download/dev/AccessibleIDE-Setup.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push is worth building. Without this, three pushes in a
# row left three Windows builds running at once, each one competing for the
# same runners, and the exe took an hour to appear. The newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pyyaml is here for the tests, not the app: one of them reads these
        # workflow files to check every build job stamps its own version.
        run: pip install flask pywebview pyyaml
      - name: Run smoke tests
        run: python smoke_test.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check front end wiring
        run: node tests/dom_harness.js

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because the version below is worked out with
          # git describe. A shallow clone has no tags in it, so that command
          # finds nothing and every build was stamped 0.0.0.dev.N.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # A main-branch build is the newest tag plus the run number, so
          # every push carries a number that is strictly newer than the one
          # before it and says which tag it was built from.
          #
          # These builds are published to the "dev" release, which no reader
          # is ever offered, so how a development build compares to a tagged
          # release does not matter. The number is here to say which commit
          # someone is testing.
          $lastTag = (git describe --tags --abbrev=0 2>$null)
          if (-not $lastTag) { $lastTag = "v0.0.0" }
          $base = $lastTag -replace '^v', ''
          $version = "$base.dev.${{ github.run_number }}"
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "Stamping version $version"
      - name: Build onefile exe
        run: pyinstaller AccessibleIDE.spec --noconfirm
      - name: Describe the build for the updater
        shell: pwsh
        run: |
          python tools/stamp_version.py manifest `
            --version "${{ steps.stamp.outputs.version }}" `
            --file dist/AccessibleIDE.exe `
            --out dist/version.json `
            --url "https://github.com/${{ github.repository }}/releases/download/latest/AccessibleIDE.exe" `
            --notes "Automatic build of the main branch."
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleIDE-windows
          path: |
            dist/AccessibleIDE.exe
            dist/version.json

  build-installer:
    name: Build Setup installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the same reason as the exe build: the
          # installer is stamped from the newest tag.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # The same version the portable build is stamped with. Without this
          # the installer would ship a program that reports the version it
          # had when the tag was cut, and a reader who installed it would
          # then be offered the very build they are already running.
          $lastTag = (git describe --tags --abbrev=0 2>$null)
          if (-not $lastTag) { $lastTag = "v0.0.0" }
          $base = $lastTag -replace '^v', ''
          $version = "$base.dev.${{ github.run_number }}"
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
          "Stamping version $version"
      - name: Build onedir app
        run: pyinstaller AccessibleIDE-onedir.spec --noconfirm
      - name: Download installer prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\prereqs" -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe" -OutFile "installer\prereqs\python-3.13.15-amd64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\prereqs\vc_redist.x64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\prereqs\MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleIDE-Setup
          path: installer/AccessibleIDE-Setup.exe

  publish-dev:
    name: Publish to dev release
    needs: [build-windows, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: AccessibleIDE-windows
          path: release/
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: AccessibleIDE-Setup
          path: release/
      # Named "dev", and the app never reads it. It used to be called
      # "latest", which is where the updater looked - so every push to main
      # quietly replaced the address readers were checking, and a
      # development build ended up being what every update check compared
      # against. Readers are served by the beta and stable channels in
      # build-release.yml instead. This release is for testing a build
      # before it is tagged.
      - name: Update dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev \
            --title "Development build" \
            --notes "Auto-built from the main branch. Not published to readers: the app checks the beta and stable channels." \
            --prerelease \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload dev release/AccessibleIDE.exe release/AccessibleIDE-Setup.exe \
            release/version.json \
            --clobber --repo "${{ github.repository }}"
