name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Every push used to start another Windows build alongside the one already
# running, and four of them at once made each one so slow that a release
# took over ten minutes in the tests alone. Superseded runs on a branch are
# now cancelled. A tagged release is never cancelled: there is nothing
# newer to replace it, and cancelling half a release is worse than a
# slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  # SignPath's action fetches the artifact it has been asked to sign back out
  # of the run, by id. Declaring permissions at all sets every scope that is
  # not listed to none, so without this the signing step cannot read its own
  # input and the failure looks like a missing artifact rather than a
  # permissions problem.
  actions: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      # The action majors are pinned rather than floated, for the same reason as in
      # build-exe.yml: a version you checked stays the version you get. These
      # run on Node 24, which the hosted runner images are on.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pyyaml is here for the tests, not the app: one of them reads these
        # workflow files to check every build job stamps its own version.
        run: pip install flask pywebview pyyaml
      - name: Run smoke tests
        run: python smoke_test.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check front end wiring
        run: node tests/dom_harness.js

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # A tag is the version itself, so the release and the program
          # inside it always agree.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: pyinstaller AccessibleIDE.spec --noconfirm
      # Code signing, off until it is asked for. Every step below is skipped
      # while SIGNPATH_ORGANIZATION_ID is blank, so this workflow goes on
      # building and releasing exactly as it did before and starts signing the
      # moment the variable is filled in. See docs/code-signing.md.
      #
      # The exe is signed before the manifest is described, not after: the
      # manifest carries the sha256 and the size of the file the app downloads,
      # and a signature changes both. Signing afterwards would publish a
      # manifest that refuses the build it describes.
      - name: Upload the unsigned exe for signing
        id: upload-unsigned-exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: dist/AccessibleIDE.exe
          if-no-files-found: error
      - name: Sign the exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe/
      - name: Put the signed exe back where the build left it
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          # The signing service returns the file it was handed, so the only
          # thing to check is that it came back and that it verifies. A
          # release that quietly ships the unsigned build would fetch a
          # signing request, pay for a ceremony and change nothing a reader
          # can see.
          $signed = Get-ChildItem signed-exe -Recurse -Filter AccessibleIDE.exe |
            Select-Object -First 1
          if (-not $signed) { throw "the signing request returned no exe" }
          Copy-Item $signed.FullName dist\AccessibleIDE.exe -Force
          $signature = Get-AuthenticodeSignature dist\AccessibleIDE.exe
          if ($signature.Status -ne 'Valid') {
            throw "the signed exe did not verify: $($signature.Status)"
          }
          Write-Output "signed by $($signature.SignerCertificate.Subject)"
      - name: Describe the build for the updater
        shell: pwsh
        run: |
          # The address has to name the tag, not "latest", so a reader who
          # installed this release is pointed at this exact file.
          python tools/stamp_version.py manifest `
            --version "${{ steps.stamp.outputs.version }}" `
            --file dist/AccessibleIDE.exe `
            --out dist/version.json `
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AccessibleIDE.exe" `
            --notes "Release ${{ github.ref_name }}."
      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-windows
          path: |
            dist/AccessibleIDE.exe
            dist/version.json

  build-installer:
    name: Build Setup installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # The same version the portable build is stamped with. Without this
          # the installer would ship a program that reports the version it
          # had when the tag was cut, and a reader who installed it would
          # then be offered the very build they are already running.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build onedir app
        run: pyinstaller AccessibleIDE-onedir.spec --noconfirm
      - name: Download installer prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\prereqs" -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.16/python-3.13.16-amd64.exe" -OutFile "installer\prereqs\python-3.13.16-amd64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\prereqs\vc_redist.x64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\prereqs\MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The 64-bit build of the compiler. From 7.x the architecture is part
          # of the file name, so the old all-in-one URL 404s.
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Compile installer
        shell: pwsh
        run: |
          # Inno Setup 7 installs under a versioned folder, so the search is a
          # pattern rather than a fixed path. Sorted descending so a machine
          # with two versions side by side picks the newer one.
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer.iss
      # Signing, and this time it is the installer itself, which is the file a
      # reader clicks. It is signed after Inno has compiled it and before it is
      # uploaded, because the signature has to be part of the bytes that get
      # published and Inno's own output is what the download link points at.
      # Skipped while SIGNPATH_ORGANIZATION_ID is blank, the same as above.
      - name: Upload the unsigned installer for signing
        id: upload-unsigned-setup
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: installer/AccessibleIDE-Setup.exe
          if-no-files-found: error
      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup/
      - name: Put the signed installer back where Inno left it
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed-setup -Recurse -Filter AccessibleIDE-Setup.exe |
            Select-Object -First 1
          if (-not $signed) { throw "the signing request returned no installer" }
          Copy-Item $signed.FullName installer\AccessibleIDE-Setup.exe -Force
          $signature = Get-AuthenticodeSignature installer\AccessibleIDE-Setup.exe
          if ($signature.Status -ne 'Valid') {
            throw "the signed installer did not verify: $($signature.Status)"
          }
          Write-Output "signed by $($signature.SignerCertificate.Subject)"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-Setup
          path: installer/AccessibleIDE-Setup.exe

  release:
    name: Create GitHub Release
    needs: [build-windows, build-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download exe
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-windows
          path: release/
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-Setup
          path: release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AccessibleIDE.exe
            release/AccessibleIDE-Setup.exe
            release/version.json
          generate_release_notes: true
          prerelease: true
      # The channels the app reads. The manifest is the channel: it points at
      # the tagged release above, so the app needs no release-list API and no
      # token, only a fixed address per channel.
      #
      # Beta also carries a copy of the two builds. It is the address the
      # README sends people to, and a download link has to land on a file.
      # Replacing those copies on every release is what keeps that link from
      # going stale, which is how it ended up pointing at a build from weeks
      # earlier. Stable stays manifest-only; nothing links to it directly.
      #
      # Neither channel is marked as the repository's latest release. The
      # "Latest" badge belongs to the newest plain-number tag, so it stays
      # empty until a stable release ships rather than pointing a reader at a
      # file that only says where to look. A beta tag must not take it either:
      # it is the one slot a reader reads as "the stable one".
      - name: Work out which channels this release belongs to
        id: channels
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          # A tag carrying a pre-release suffix is work in progress. A plain
          # number is a finished change, so it also moves the stable channel.
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      # A reader must never be offered an update that cannot arrive: the
      # address has to belong to the project the app trusts, and the version
      # must not go backwards from the one already on the channel. The check
      # refuses the run rather than publishing something nobody will receive.
      - name: Check the beta channel can move
        run: |
          python tools/check_publish.py check \
            --channel beta \
            --version "${GITHUB_REF_NAME#v}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AccessibleIDE.exe" \
            --repo "${{ github.repository }}"
      - name: Point the beta channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create beta \
            --title "Beta channel" \
            --notes "The newest tagged release, for readers who want new work as it lands. Moved by every release." \
            --prerelease \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload beta release/version.json \
            --clobber --repo "${{ github.repository }}"
          # The two builds ride along, because the README sends readers here
          # and a download link has to land on a file rather than on the
          # manifest that only says where the file is.
          gh release upload beta release/AccessibleIDE.exe release/AccessibleIDE-Setup.exe \
            --clobber --repo "${{ github.repository }}"
      - name: Check the stable channel can move
        if: steps.channels.outputs.stable == 'true'
        run: |
          python tools/check_publish.py check \
            --channel stable \
            --version "${GITHUB_REF_NAME#v}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AccessibleIDE.exe" \
            --repo "${{ github.repository }}"
      - name: Point the stable channel at this release
        if: steps.channels.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create stable \
            --title "Stable channel" \
            --notes "Big finished changes only. Moved when a release is tagged without a pre-release suffix." \
            --latest=false \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload stable release/version.json \
            --clobber --repo "${{ github.repository }}"