name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Every push used to start another Windows build alongside the one already
# running, and four of them at once made each one so slow that a release
# took over ten minutes in the tests alone. Superseded runs on a branch are
# now cancelled. A tagged release is never cancelled: there is nothing
# newer to replace it, and cancelling half a release is worse than a
# slow one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      # The action majors are pinned rather than floated, for the same reason as in
      # build-exe.yml: a version you checked stays the version you get. These
      # run on Node 24, which the hosted runner images are on.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pyyaml is here for the tests, not the app: one of them reads these
        # workflow files to check every build job stamps its own version.
        run: pip install flask pywebview pyyaml
      - name: Run smoke tests
        run: python smoke_test.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Check front end wiring
        run: node tests/dom_harness.js

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # A tag is the version itself, so the release and the program
          # inside it always agree.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: pyinstaller AccessibleIDE.spec --noconfirm
      - name: Describe the build for the updater
        shell: pwsh
        run: |
          # The address has to name the tag, not "latest", so a reader who
          # installed this release is pointed at this exact file.
          python tools/stamp_version.py manifest `
            --version "${{ steps.stamp.outputs.version }}" `
            --file dist/AccessibleIDE.exe `
            --out dist/version.json `
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AccessibleIDE.exe" `
            --notes "Release ${{ github.ref_name }}."
      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-windows
          path: |
            dist/AccessibleIDE.exe
            dist/version.json

  build-installer:
    name: Build Setup installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install flask pywebview pyinstaller
      - name: Work out this build's version
        id: stamp
        shell: pwsh
        run: |
          # The same version the portable build is stamped with. Without this
          # the installer would ship a program that reports the version it
          # had when the tag was cut, and a reader who installed it would
          # then be offered the very build they are already running.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          python tools/stamp_version.py stamp --version $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build onedir app
        run: pyinstaller AccessibleIDE-onedir.spec --noconfirm
      - name: Download installer prerequisites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "installer\prereqs" -Force | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.16/python-3.13.16-amd64.exe" -OutFile "installer\prereqs\python-3.13.16-amd64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "installer\prereqs\vc_redist.x64.exe" -UseBasicParsing
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\prereqs\MicrosoftEdgeWebview2Setup.exe" -UseBasicParsing
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # The 64-bit build of the compiler. From 7.x the architecture is part
          # of the file name, so the old all-in-one URL 404s.
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Compile installer
        shell: pwsh
        run: |
          # Inno Setup 7 installs under a versioned folder, so the search is a
          # pattern rather than a fixed path. Sorted descending so a machine
          # with two versions side by side picks the newer one.
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { $iscc = Get-ChildItem "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer.iss
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AccessibleIDE-Setup
          path: installer/AccessibleIDE-Setup.exe

  release:
    name: Create GitHub Release
    needs: [build-windows, build-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Download exe
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-windows
          path: release/
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: AccessibleIDE-Setup
          path: release/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AccessibleIDE.exe
            release/AccessibleIDE-Setup.exe
            release/version.json
          generate_release_notes: true
          prerelease: true
      # The channels the app reads. Both are moving release tags holding
      # one file: the manifest, which points at the tagged release above.
      # Nothing else is copied, so the app needs no release-list API and no
      # token, only a fixed address per channel.
      #
      # Neither channel is marked as the repository's latest release, so the
      # "Latest" badge on the releases page stays on a real build rather than
      # pointing a reader at a file that only says where to look.
      - name: Work out which channels this release belongs to
        id: channels
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          # A tag carrying a pre-release suffix is work in progress. A plain
          # number is a finished change, so it also moves the stable channel.
          if [[ "$version" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Point the beta channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create beta \
            --title "Beta channel" \
            --notes "The newest tagged release, for readers who want new work as it lands. Moved by every release." \
            --prerelease \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload beta release/version.json \
            --clobber --repo "${{ github.repository }}"
      - name: Point the stable channel at this release
        if: steps.channels.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create stable \
            --title "Stable channel" \
            --notes "Big finished changes only. Moved when a release is tagged without a pre-release suffix." \
            --latest=false \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload stable release/version.json \
            --clobber --repo "${{ github.repository }}"