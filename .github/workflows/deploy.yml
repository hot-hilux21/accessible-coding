name: Deploy Website to Oracle Cloud
on:
  push:
    branches:
      - main  # Triggers the update whenever you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH deployment commands
        uses: appleboy/ssh-action@master
        with:
          host: 132.145.69.213
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/opc/accessible-coding
            # A plain pull reports success when there is nothing to merge and
            # does nothing when the checkout has drifted, so the server was
            # left running a build from before the rename while every deploy
            # went green. Fetch, then move the checkout onto the pushed
            # commit: .env is untracked, so it survives.
            git fetch --prune origin main
            git reset --hard origin/main
            git --no-pager log --oneline -1
            source venv/bin/activate
            pip install -r requirements.txt
            # The PM2 process is named accessible-coding and is started from
            # run.sh, which loads .env and runs gunicorn. Restarting a name
            # that does not exist fails, and the site stays on the old code,
            # so start it if it is missing.
            pm2 restart accessible-coding --update-env || pm2 start run.sh --name accessible-coding
            # Make the process list survive a reboot.
            pm2 save
            # Fail the run when the app is not actually serving, instead of
            # reporting a green deploy over a dead site.
            sleep 3
            curl -fsS http://127.0.0.1:3000/health
            # Health alone only proves something is listening, which is how a
            # deploy of old code passed. Ask for a word that only the current
            # build prints, so a stale checkout fails the run instead.
            curl -fsS http://127.0.0.1:3000/ | grep -q 'AccessibleCoding'